{% extends "base.html" %}

{% block subtitle %}统一管理 Telegram 频道资源自动监控节点{% endblock %}

{% block content %}
<div class="glass-panel animate-fade-in delay-1" style="max-width: 800px; margin-bottom: 2rem;">
    <h2 style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <span style="display: flex; align-items: center; gap: 1rem;">
            <i class="fa-solid fa-satellite-dish"></i> Telegram 监控节点设置
            <button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.9rem;" onclick="testTgMonitor(this)">
                <i class="fa-solid fa-plug-circle-check"></i> 测试连通性
            </button>
            <button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.9rem; color: var(--accent); border-color: var(--accent);" onclick="scrapeTgMonitor(this)">
                <i class="fa-solid fa-clock-rotate-left"></i> 抓取历史消息
            </button>
        </span>
        <label class="switch">
            <input type="checkbox" id="mon_tg_enabled">
            <span class="slider round"></span>
        </label>
    </h2>
    <form id="monitorForm">
        <div class="form-group">
            <label class="form-label">API ID (来自 my.telegram.org)</label>
            <input type="text" id="mon_tg_api_id" class="form-control" placeholder="1234567">
        </div>
        <div class="form-group">
            <label class="form-label">API Hash</label>
            <input type="password" id="mon_tg_api_hash" class="form-control" placeholder="xxxxxxxxxxxxxxxxxxxxxx">
        </div>
        <div class="form-group">
            <label class="form-label">Bot Token (可选，若不填则作为 Userbot 运行，需进终端手动扫码登录)</label>
            <input type="password" id="mon_tg_bot_token" class="form-control" placeholder="123456789:ABCdefGHIjklmNoPqrsTuvwxyZ">
        </div>
        <div class="form-group">
            <label class="form-label">Proxy 代理 (可选, 如 http://127.0.0.1:7890)</label>
            <input type="text" id="mon_tg_proxy" class="form-control" placeholder="http://127.0.0.1:7890">
        </div>
        <div class="form-group">
            <label class="form-label">监听频道列表 (每行一个，支持直接粘贴完整的消息链接)</label>
            <textarea id="mon_tg_channels" class="form-control" rows="3" placeholder="https://t.me/c/123456789/100&#10;https://t.me/share_channel_name&#10;-1001234567890"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">消息关键字过滤 (可选，每行一个。Telegram消息包含任意关键字即处理)</label>
            <textarea id="mon_tg_keywords" class="form-control" rows="3" placeholder="蓝光&#10;洗版"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">资源匹配过滤规则 (可选，正则表达式，每行一个。仅转存115分享链接内文件名匹配的资源)</label>
            <div style="display: flex; gap: 0.5rem; flex-direction: column;">
                <textarea id="mon_tg_filter_rules" class="form-control" rows="3" placeholder="1080p&#10;.*S01.*"></textarea>
                <button type="button" class="btn btn-outline" style="align-self: flex-start; padding: 0.3rem 0.6rem; font-size: 0.9rem;" onclick="openTmdbModal()"><i class="fa-solid fa-film"></i> TMDB 可视化配置正则</button>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">115 转存中转目录 ID (必填，转存后存放的位置)</label>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="mon_tg_target_dir_id" class="form-control" placeholder="点击右侧按钮选择..." readonly>
                <button type="button" class="btn btn-secondary" onclick="window.openDirectoryPicker(id => document.getElementById('mon_tg_target_dir_id').value = id, '115')" style="white-space: nowrap; padding: 0.5rem 1rem;">
                    <i class="fa-solid fa-folder-open"></i> 选择目录
                </button>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">115 整理归档根目录 ID (可选，开启自动整理后归档目标根路径)</label>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="mon_tg_archive_dir_id" class="form-control" placeholder="点击右侧按钮选择..." readonly>
                <button type="button" class="btn btn-secondary" onclick="window.openDirectoryPicker(id => document.getElementById('mon_tg_archive_dir_id').value = id, '115')" style="white-space: nowrap; padding: 0.5rem 1rem;">
                    <i class="fa-solid fa-folder-open"></i> 选择目录
                </button>
            </div>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 1rem; margin-top: 1rem;">
            <label class="form-label" style="margin-bottom: 0;">自动整理转存的文件</label>
            <label class="switch">
                <input type="checkbox" id="mon_tg_auto_organize">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 1rem; margin-top: 1rem;">
            <label class="form-label" style="margin-bottom: 0;">转存整理后自动触发全局 STRM 生成</label>
            <label class="switch">
                <input type="checkbox" id="mon_tg_auto_strm">
                <span class="slider round"></span>
            </label>
        </div>
    </form>
</div>

<div style="max-width: 800px; display: flex; justify-content: flex-end;">
    <button class="btn btn-primary" style="padding: 0.75rem 2rem; font-size: 1.1rem; box-shadow: 0 0 15px rgba(99,102,241,0.4);" onclick="saveMonitorConfig()" id="saveBtn">
        <i class="fa-solid fa-floppy-disk"></i> 保存并热加载
    </button>
</div>
{% endblock %}

{% block scripts %}
<style>
/* iOS Style Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 24px;
}
.switch input { 
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(255,255,255,0.1);
  transition: .4s;
}
.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: var(--text-primary);
  transition: .4s;
}
input:checked + .slider {
  background-color: var(--success);
}
input:focus + .slider {
  box-shadow: 0 0 1px var(--success);
}
input:checked + .slider:before {
  transform: translateX(26px);
}
.slider.round {
  border-radius: 24px;
}
.slider.round:before {
  border-radius: 50%;
}
</style>

<!-- TMDB Modal -->
<div id="tmdbModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center;">
    <div class="glass-panel animate-fade-in" style="width: 90%; max-width: 600px; padding: 1.5rem; display: flex; flex-direction: column; max-height: 80vh;">
        <h3 style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <span><i class="fa-solid fa-film"></i> TMDB 可视化配置正则</span>
            <i class="fa-solid fa-xmark" style="cursor: pointer; color: var(--text-secondary);" onclick="closeTmdbModal()"></i>
        </h3>
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
            <select id="tmdbSearchType" class="form-control" style="width: 100px; padding: 0.3rem;">
                <option value="multi">全部</option>
                <option value="movie">电影</option>
                <option value="tv">剧集</option>
            </select>
            <select id="tmdbYearPolicy" class="form-control" style="width: 140px; padding: 0.3rem;">
                <option value="auto">年份: 自动配置</option>
                <option value="force">年份: 强制包含</option>
                <option value="none">年份: 不包含</option>
            </select>
            <input type="text" id="tmdbSearchKeyword" class="form-control" placeholder="输入影视剧名称搜索..." style="flex: 1;" onkeydown="if(event.key==='Enter') searchTmdb()">
            <button type="button" class="btn btn-primary" onclick="searchTmdb()"><i class="fa-solid fa-search"></i> 搜索</button>
        </div>
        <div id="tmdbSearchResults" style="flex: 1; overflow-y: auto; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 0.5rem; min-height: 300px; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
            <!-- 结果将渲染在这里 -->
        </div>
    </div>
</div>

<script>
function openTmdbModal() {
    document.getElementById('tmdbModal').style.display = 'flex';
    document.getElementById('tmdbSearchKeyword').focus();
}

function closeTmdbModal() {
    document.getElementById('tmdbModal').style.display = 'none';
    document.getElementById('tmdbSearchResults').innerHTML = '';
}

async function searchTmdb() {
    const keyword = document.getElementById('tmdbSearchKeyword').value.trim();
    const type = document.getElementById('tmdbSearchType').value;
    const resultsContainer = document.getElementById('tmdbSearchResults');
    
    if (!keyword) return;
    
    resultsContainer.innerHTML = '<div style="text-align: center; padding: 1rem;">搜索中...</div>';
    
    try {
        const res = await fetch(`/api/v1/search/tmdb?keyword=${encodeURIComponent(keyword)}&media_type=${type}`);
        const data = await res.json();
        
        if (data.status === 'error') {
            throw new Error(data.message || '搜索失败');
        }
        
        if (data.status === 'success' && data.data && data.data.length > 0) {
            resultsContainer.innerHTML = '';
            data.data.forEach(item => {
                const title = item.title || item.name;
                const originalTitle = item.original_title || item.original_name || '';
                const releaseDate = item.release_date || item.first_air_date || '';
                const year = releaseDate ? releaseDate.substring(0, 4) : '';
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : 'https://via.placeholder.com/45x68?text=No+Image';
                
                const div = document.createElement('div');
                div.style.cssText = 'display: flex; gap: 1rem; align-items: center; padding: 0.5rem; background: var(--bg-secondary); border-radius: 4px; cursor: pointer; transition: background 0.2s; border: 1px solid var(--border-color);';
                div.onmouseover = () => div.style.background = 'var(--bg-hover)';
                div.onmouseout = () => div.style.background = 'var(--bg-secondary)';
                
                div.onclick = async () => {
                    let regex = '';
                    const safeTitle = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const safeOrig = originalTitle ? originalTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '';
                    
                    const yearPolicy = document.getElementById('tmdbYearPolicy').value;
                    let names = safeOrig && safeOrig !== safeTitle ? `(${safeTitle}|${safeOrig})` : safeTitle;
                    
                    let shouldIncludeYear = false;
                    if (yearPolicy === 'force') shouldIncludeYear = true;
                    else if (yearPolicy === 'none') shouldIncludeYear = false;
                    else shouldIncludeYear = (item.media_type === 'movie');
                    
                    if (shouldIncludeYear && year) {
                        regex = `^(?=.*${names})(?=.*${year}).*$`;
                    } else {
                        regex = `^(?=.*${names}).*$`;
                    }
                    
                    if (await window.customConfirm(`为您生成正则：\n${regex}\n\n确认添加到规则列表吗？`)) {
                        const textarea = document.getElementById('mon_tg_filter_rules');
                        const val = textarea.value.trim();
                        textarea.value = val ? val + '\n' + regex : regex;
                        closeTmdbModal();
                    }
                };
                
                div.innerHTML = `
                    <img src="${poster}" style="width: 45px; height: 68px; object-fit: cover; border-radius: 2px;">
                    <div style="flex: 1;">
                        <div style="font-weight: bold; margin-bottom: 0.2rem;">${title} <span style="color: var(--text-muted); font-weight: normal;">(${year})</span></div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">${originalTitle}</div>
                    </div>
                    <div style="padding: 0 1rem; color: var(--primary);">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                `;
                resultsContainer.appendChild(div);
            });
        } else {
            resultsContainer.innerHTML = '<div style="text-align: center; padding: 1rem;">没有找到相关结果</div>';
        }
    } catch (e) {
        resultsContainer.innerHTML = '<div style="text-align: center; padding: 1rem; color: var(--danger);">搜索失败: ' + e.message + '</div>';
    }
}

// 页面加载时自动获取配置
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/v1/system/config');
        if (res.ok) {
            const config = await res.json();
            
            // 填充 Monitor Telegram
            document.getElementById('mon_tg_enabled').checked = config.monitor.telegram.enabled;
            document.getElementById('mon_tg_api_id').value = config.monitor.telegram.api_id || '';
            document.getElementById('mon_tg_api_hash').value = config.monitor.telegram.api_hash || '';
            document.getElementById('mon_tg_bot_token').value = config.monitor.telegram.bot_token || '';
            document.getElementById('mon_tg_proxy').value = config.monitor.telegram.proxy || '';
            document.getElementById('mon_tg_channels').value = (config.monitor.telegram.channels || []).join('\n');
            document.getElementById('mon_tg_keywords').value = (config.monitor.telegram.keywords || []).join('\n');
            document.getElementById('mon_tg_filter_rules').value = (config.monitor.telegram.filter_rules || []).join('\n');
            document.getElementById('mon_tg_target_dir_id').value = config.monitor.telegram.target_dir_id || '0';
            document.getElementById('mon_tg_archive_dir_id').value = config.monitor.telegram.archive_dir_id || '0';
            document.getElementById('mon_tg_auto_organize').checked = config.monitor.telegram.auto_organize;
            document.getElementById('mon_tg_auto_strm').checked = config.monitor.telegram.auto_strm;
        }
    } catch (e) {
        console.error('Failed to load config', e);
    }
});

async function saveMonitorConfig() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 保存中...';
    
    // 提取通道列表并过滤空行
    const tgChannels = document.getElementById('mon_tg_channels').value.split('\n').map(c => c.trim()).filter(c => c);
    const tgKeywords = document.getElementById('mon_tg_keywords').value.split('\n').map(c => c.trim()).filter(c => c);
    const tgFilterRules = document.getElementById('mon_tg_filter_rules').value.split('\n').map(c => c.trim()).filter(c => c);

    const payload = {
        monitor: {
            telegram: {
                enabled: document.getElementById('mon_tg_enabled').checked,
                api_id: document.getElementById('mon_tg_api_id').value,
                api_hash: document.getElementById('mon_tg_api_hash').value,
                bot_token: document.getElementById('mon_tg_bot_token').value,
                proxy: document.getElementById('mon_tg_proxy').value,
                channels: tgChannels,
                keywords: tgKeywords,
                filter_rules: tgFilterRules,
                target_dir_id: document.getElementById('mon_tg_target_dir_id').value,
                archive_dir_id: document.getElementById('mon_tg_archive_dir_id').value,
                auto_organize: document.getElementById('mon_tg_auto_organize').checked,
                auto_strm: document.getElementById('mon_tg_auto_strm').checked
            }
        }
    };
    
    try {
        const res = await fetch('/api/v1/system/config', {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        if (res.ok) {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> 保存成功！已热加载';
            btn.style.background = 'var(--success)';
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存并热加载';
                btn.style.background = '';
            }, 2000);
            return true;
        } else {
            const err = await res.json();
            alert('保存失败: ' + err.detail);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存并热加载';
            return false;
        }
    } catch (e) {
        alert('网络请求失败');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存并热加载';
        return false;
    }
}

async function testTgMonitor(btn) {
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 测试中...';
    
    // 获取当前填写的配置，但不保存
    const tgChannels = document.getElementById('mon_tg_channels').value.split('\n').map(l => l.trim()).filter(l => l);
    
    const requestData = {
        api_id: document.getElementById('mon_tg_api_id').value,
        api_hash: document.getElementById('mon_tg_api_hash').value,
        bot_token: document.getElementById('mon_tg_bot_token').value,
        proxy: document.getElementById('mon_tg_proxy').value,
        channels: tgChannels
    };
    
    try {
        const res = await fetch('/api/v1/system/test-monitor/telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            await window.customConfirm(`✅ 测试成功！\n\n${data.message}`);
        } else {
            await window.customConfirm(`❌ 测试失败！\n\n${data.message}`);
        }
    } catch (e) {
        alert('网络请求失败');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

async function scrapeTgMonitor(btn) {
    const originalText = btn.innerHTML;
    
    // 获取当前填写的配置，但不保存
    const tgChannels = document.getElementById('mon_tg_channels').value.split('\n').map(l => l.trim()).filter(l => l);
    const tgKeywords = document.getElementById('mon_tg_keywords').value.split('\n').map(l => l.trim()).filter(l => l);
    
    if (tgChannels.length === 0) {
        alert("请先添加至少一个监听频道后再试！");
        return;
    }
    
    let confirmMsg = `是否立即触发历史消息检索？\n\n- 将对您填写的频道进行全量历史消息/匹配关键字检索。\n- 提取到的分享链接将加入后台队列，间隔 3 秒慢慢转存。\n- 请不要频繁点击此按钮，以免被 115 封控。`;
    
    if (tgKeywords.length === 0) {
        confirmMsg = `⚠️ 高危操作警告：未配置过滤关键字！\n\n您没有填写任何关键字，这将导致系统对整个频道【从头到尾的所有历史消息】进行无差别全量抓取。\n如果该频道历史悠久，这将会耗费极长时间，并产生海量的转存排队任务。\n\n您确定要继续进行【无差别全量抓取】吗？`;
    }
    
    const confirmScrape = await window.customConfirm(confirmMsg);
    if (!confirmScrape) return;
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 任务投递中...';

    const requestData = {
        api_id: document.getElementById('mon_tg_api_id').value,
        api_hash: document.getElementById('mon_tg_api_hash').value,
        bot_token: document.getElementById('mon_tg_bot_token').value,
        proxy: document.getElementById('mon_tg_proxy').value,
        channels: tgChannels,
        keywords: tgKeywords
    };
    
    try {
        const res = await fetch('/api/v1/system/scrape-monitor/telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            await window.customConfirm(`✅ 任务投递成功！\n\n${data.message}`);
        } else {
            await window.customConfirm(`❌ 任务失败！\n\n${data.message}`);
        }
    } catch (e) {
        alert('网络请求失败');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}
</script>
{% endblock %}
