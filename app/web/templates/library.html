{% extends "base.html" %}

{% block subtitle %}统一资源图鉴库{% endblock %}

{% block content %}
<div class="glass-panel animate-fade-in delay-1" style="margin-bottom: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0;"><i class="fa-solid fa-photo-film"></i> Telegram 私有资源库</h2>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <input type="text" id="searchInput" class="form-control" placeholder="搜索影视名称..." style="width: 250px;" onkeyup="if(event.key === 'Enter') loadLibrary()">
            <button class="btn btn-primary" onclick="loadLibrary()"><i class="fa-solid fa-magnifying-glass"></i></button>
            <select id="pageSize" class="form-control" onchange="loadLibrary()" style="width: auto;">
                <option value="20">20 / 页</option>
                <option value="50" selected>50 / 页</option>
                <option value="100">100 / 页</option>
            </select>
            <button class="btn btn-secondary" onclick="migrateLegacy()" title="补全老数据海报">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('jsonUpload').click()">
                <i class="fa-solid fa-file-import"></i> 导入 TG 历史 JSON
            </button>
            <input type="file" id="jsonUpload" accept=".json" style="display: none;" onchange="handleFileUpload(event)">
        </div>
    </div>
    
    <div id="libraryContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; align-items: stretch;">
        <!-- 动态渲染 -->
    </div>

    <div id="libraryLoadMoreTrigger" style="height: 1px;"></div>
    
    <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <span id="pageInfo" style="color: var(--text-secondary);"></span>
        <span style="font-size: 0.85rem; color: var(--text-secondary);">滚动到底部时自动加载更多</span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 0;
let totalGroups = 0;
let currentGroups = [];
let renderedGroupCount = 0;
let renderObserver = null;
let hasMorePages = true;
let isFetchingGroups = false;
const GROUP_BATCH_SIZE = 12;

const POSTER_PLACEHOLDER = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMjQwIj4KICA8cmVjdCB3aWR0aD0iMTYwIiBoZWlnaHQ9IjI0MCIgZmlsbD0iIzJkMzc0OCIvPgogIDx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjYTBhZWMwIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNiI+Tm8gSW1hZ2U8L3RleHQ+Cjwvc3ZnPg==';

function escapeHtml(value) {
    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function getThumbnailPoster(url, size = 'w185') {
    if (!url) return POSTER_PLACEHOLDER;
    if (url.includes('image.tmdb.org/t/p/')) {
        return url.replace(/\/t\/p\/(w\d+|original)\//, `/t/p/${size}/`);
    }
    return url;
}

function renderLibraryCard(group) {
    const title = escapeHtml(group.base_title || '未知剧集');
    const overview = escapeHtml(group.overview || '暂无内容简介');
    const poster = getThumbnailPoster(group.poster_url, 'w185');
    const detailUrl = `/library/detail?base_title=${encodeURIComponent(group.base_title || '')}`;

    return `
        <a href="${detailUrl}" class="glass-panel" style="padding: 0.9rem; overflow: hidden; display: flex; flex-direction: column; gap: 0.9rem; text-decoration: none; color: inherit; min-height: 100%; transition: transform 0.2s ease, box-shadow 0.2s ease;">
            <div style="aspect-ratio: 2 / 3; width: 100%; border-radius: 14px; background: rgba(255,255,255,0.04); overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,0.22);">
                <img src="${poster}" loading="lazy" decoding="async" onerror="this.src='${POSTER_PLACEHOLDER}'" alt="${title}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.6rem; min-width: 0;">
                <h3 style="margin: 0; font-size: 1rem; line-height: 1.4; word-break: break-word;">${title}</h3>
                <p style="margin: 0; color: var(--text-secondary); font-size: 0.84rem; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">${overview}</p>
            </div>
        </a>
    `;
}

function updatePageInfo(message = '') {
    const pageInfo = document.getElementById('pageInfo');
    if (!pageInfo) return;

    if (message) {
        pageInfo.textContent = message;
        return;
    }

    if (!currentGroups.length && !isFetchingGroups) {
        pageInfo.textContent = '暂无资源';
        return;
    }

    const loadedText = `已加载 ${currentGroups.length} / ${totalGroups || currentGroups.length} 部资源`;
    pageInfo.textContent = hasMorePages ? `${loadedText}，下滑继续加载` : `${loadedText}，已全部加载`;
}

function disconnectRenderObserver() {
    if (renderObserver) {
        renderObserver.disconnect();
        renderObserver = null;
    }
}

function renderNextGroupBatch() {
    const container = document.getElementById('libraryContainer');
    if (!container || renderedGroupCount >= currentGroups.length) {
        disconnectRenderObserver();
        return;
    }

    const slice = currentGroups.slice(renderedGroupCount, renderedGroupCount + GROUP_BATCH_SIZE);
    const fragment = document.createRange().createContextualFragment(slice.map(renderLibraryCard).join(''));
    container.appendChild(fragment);
    renderedGroupCount += slice.length;

    if (renderedGroupCount >= currentGroups.length) {
        if (!hasMorePages) {
            disconnectRenderObserver();
        }
    }

    updatePageInfo();
}

function setupLazyRender() {
    disconnectRenderObserver();

    const trigger = document.getElementById('libraryLoadMoreTrigger');
    if (!trigger || (!hasMorePages && renderedGroupCount >= currentGroups.length)) {
        return;
    }

    renderObserver = new IntersectionObserver((entries) => {
        if (entries.some(entry => entry.isIntersecting)) {
            if (renderedGroupCount < currentGroups.length) {
                renderNextGroupBatch();
                return;
            }
            if (hasMorePages && !isFetchingGroups) {
                fetchLibraryPage(currentPage + 1);
            }
        }
    }, { rootMargin: '200px 0px' });

    renderObserver.observe(trigger);
}

async function fetchLibraryPage(page) {
    if (isFetchingGroups) {
        return;
    }

    const search = document.getElementById('searchInput').value;
    const pageSize = Number(document.getElementById('pageSize').value);
    const container = document.getElementById('libraryContainer');
    isFetchingGroups = true;
    updatePageInfo('加载中...');
    
    try {
        const res = await fetch(`/api/v1/library/tg_resources?page=${page}&page_size=${pageSize}&search=${encodeURIComponent(search)}`);
        const data = await res.json();
        const groups = data.data || [];
        currentPage = data.page || page;
        totalGroups = data.total || 0;
        hasMorePages = Boolean(data.has_more);
        
        if (page === 1) {
            currentGroups = [];
            renderedGroupCount = 0;
            container.innerHTML = '';
        }

        if (page === 1 && groups.length === 0) {
            currentGroups = [];
            renderedGroupCount = 0;
            hasMorePages = false;
            container.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:2rem;">暂无数据</div>';
        } else {
            currentGroups.push(...groups);
            renderNextGroupBatch();
            setupLazyRender();
        }

        updatePageInfo();
    } catch(e) {
        if (page === 1) {
            currentGroups = [];
            renderedGroupCount = 0;
            container.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:2rem; color:#ef4444;">加载失败</div>';
        }
        updatePageInfo('加载失败，请稍后重试');
    } finally {
        isFetchingGroups = false;
    }
}

async function loadLibrary() {
    disconnectRenderObserver();
    currentPage = 0;
    totalGroups = 0;
    currentGroups = [];
    renderedGroupCount = 0;
    hasMorePages = true;
    document.getElementById('libraryContainer').innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:2rem;">加载中...</div>';
    updatePageInfo('加载中...');
    await fetchLibraryPage(1);
}

async function transferResource(id, btn) {
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 投递中';
    try {
        const res = await fetch('/api/v1/library/transfer_selected', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: [id], base_title: '' })
        });
        const data = await res.json();
        if (data.status === 'success') {
            showToast('已加入转存队列', 'success');
            loadLibrary();
        } else {
            showToast('失败: ' + (data.message || '未知错误'), 'error');
            btn.disabled = false;
            btn.innerHTML = orig;
        }
    } catch(e) {
        showToast('网络错误', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
    }
}

async function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const formData = new FormData();
    formData.append('file', file);
    
    if(!confirm(`即将上传解析 ${file.name}，这可能需要一点时间，确定继续吗？`)) return;
    
    try {
        const res = await fetch('/api/v1/library/upload_json', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (data.status === 'success') {
            await window.customConfirm(`✅ 导入已启动\n\n${data.message}`);
            setTimeout(() => loadLibrary(), 2000);
        } else {
            alert('导入失败: ' + data.message);
        }
    } catch (err) {
        alert('上传请求失败');
    }
    e.target.value = '';
}

// 初始加载
document.addEventListener('DOMContentLoaded', () => loadLibrary());

async function migrateLegacy() {
    if(!confirm('是否启动后台清洗？（会自动为没有海报的旧数据刮削海报）')) return;
    try {
        const res = await fetch(`/api/v1/library/migrate_legacy`, { method: 'POST' });
        const data = await res.json();
        alert(data.message);
    } catch(e) {
        alert('请求失败');
    }
}
</script>
{% endblock %}
