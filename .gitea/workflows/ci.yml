name: CI

"on":
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: PYTHONPATH=. uv run pytest -q

      - name: Build Docker images
        run: |
          docker build -t python-strm:ci .
          docker build -t pansou-src:ci ./pansou_src
